spring:
  datasource:
    url: jdbc:mysql://localhost:33306/onion-db
    username: onion-user
    password: onion-password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
